  <div class="ic">

    <button id="bf"><svg viewBox="0 0 24 24"><path d="M12 20s-8-5-8-10.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 8 3.5C20 15 12 20 12 20z"/></svg><span>Yêu thích</span><em id="fc">0</em></button>

    <div class="tiles" id="tl"></div>
    <div class="qs"><b>Tìm nhanh:</b><span id="sd"></span></div>

  <form class="flt2" id="flt" onsubmit="return false">

      <div class="ls"><span>&#128205;</span><select id="fcity" aria-label="Tỉnh/Thành phố"></select><select id="fd" aria-label="Quận/Huyện"></select></div>
